        description: "Invokes addApplicationListener."
        params:
          - name: listener
            type: java.lang.String
      "addApplicationParameter(java.lang.ApplicationParameter)":
        description: "Invokes addApplicationParameter."
        params:
          - name: parameter
            type: java.lang.ApplicationParameter
      "addBefore(java.lang.FilterMap)":
