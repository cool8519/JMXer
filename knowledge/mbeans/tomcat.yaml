      FailCtxIfServletStartFails:
        description: "Returns the failCtxIfServletStartFails."
      FilterRegistrations:
        description: "Returns the filterRegistrations."
      FireRequestListenersOnForwards:
        description: "Returns the fireRequestListenersOnForwards."
      IgnoreAnnotations:
        description: "{@inheritDoc} The default value for this implementation is false."
      InitParameterNames:
        description: "Returns the initParameterNames."
      InstanceManager:
        description: "Returns the instanceManager."
      J2EEApplication:
        description: "Returns the j2EEApplication."
      J2EEServer:
        description: "Returns the j2EEServer."
      JarScanner:
        description: "Returns the jarScanner."
      JndiExceptionOnFailedWrite:
        description: "Returns the jndiExceptionOnFailedWrite."
      JspConfigDescriptor:
        description: "Returns the jspConfigDescriptor."
      Loader:
        description: "Returns the loader."
      LogEffectiveWebXml:
        description: "Returns the logEffectiveWebXml."
      LoginConfig:
        description: "Returns the loginConfig."
      MajorVersion:
        description: "Returns the majorVersion."
      Manager:
        description: "Returns the manager."
      MapperContextRootRedirectEnabled:
