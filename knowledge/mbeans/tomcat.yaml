  - match:
      objectName: "Catalina:type=DataSource,host=*,context=*,class=javax.sql.DataSource,name=*"
      className: "org.apache.tomcat.jdbc.pool.jmx.ConnectionPoolMBean"
    description: "Apache Tomcat JDBC connection pool MBean."
    attributes:
      AbandonWhenPercentageFull:
        description: "Connections that have been abandoned (timed out) wont get closed and reported up unless the number of connections in use are above the percentage defined by abandonWhenPercentageFull. The value should be between 0-100. The default value is 0, which implies that connections are eligible for closure as soon as removeAbandonedTimeout has been reached."
      AccessToUnderlyingConnectionAllowed:
        description: "Property not used. Access is always allowed. Access can be achieved by calling unwrap on the pooled connection. see {@link javax.sql.DataSource} interface or call getConnection through reflection or cast the object as {@link javax.sql.PooledConnection}."
      Active:
        description: "Returns the active."
      AlternateUsernameAllowed:
        description: "Returns true if the call {@link DataSource#getConnection(String, String) getConnection(username,password)} is allowed. This is used for when the pool is used by an application accessing multiple schemas. There is a performance impact turning this option on."
      BorrowedCount:
        description: "Returns the borrowedCount."
      CommitOnReturn:
        description: "Returns the commitOnReturn."
      ConnectionProperties:
        description: "The connection properties that will be sent to the JDBC driver when establishing new connections. Format of the string is [propertyName=property;] NOTE - The 'user' and 'password' properties will be passed explicitly, so they do not need to be included here. The default value is null."
      CreatedCount:
        description: "Returns the createdCount."
      DataSource:
        description: "Returns a datasource, if one exists that is being used to create connections. This method will return null if the pool is using a {@link java.sql.Driver}."
      DataSourceJNDI:
        description: "Returns the JNDI string configured for data source usage."
      DbProperties:
        description: "Returns the database properties that are passed into the {@link java.sql.Driver#connect(String, Properties)} method."
      DefaultAutoCommit:
        description: "The default auto-commit state of connections created by this pool. If not set (null), default is JDBC driver default (If set to null then the {@link java.sql.Connection#setAutoCommit(boolean)} method will not be called.)."
      DefaultCatalog:
        description: "If non null, during connection creation the method {@link java.sql.Connection#setCatalog(String)} will be called with the set value."
      DefaultReadOnly:
        description: "If non null, during connection creation the method {@link java.sql.Connection#setReadOnly(boolean)} will be called with the set value."
      DefaultTransactionIsolation:
        description: "Returns the default transaction isolation level. If set to {@link DataSourceFactory#UNKNOWN_TRANSACTIONISOLATION} the method {@link java.sql.Connection#setTransactionIsolation(int)} will not be called during connection creation."
      DriverClassName:
        description: "The fully qualified Java class name of the JDBC driver to be used. The driver has to be accessible from the same classloader as tomcat-jdbc.jar."
      FairQueue:
        description: "Returns true if a fair queue is being used by the connection pool."
      Idle:
        description: "Returns the idle."
      IgnoreExceptionOnPreLoad:
        description: "Tests whether ignoreExceptionOnPreLoad."
      InitSQL:
        description: "A custom query to be run when a connection is first created. The default value is null. This query only runs once per connection, and that is when a new connection is established to the database. If this value is non null, it will replace the validation query during connection creation."
      InitialSize:
        description: "Returns the number of connections that will be established when the connection pool is started. Default value is 10."
      JdbcInterceptors:
        description: "A semicolon separated list of classnames extending {@link org."
      JdbcInterceptorsAsArray:
        description: "Returns the {@link #getJdbcInterceptors()} as an array of objects with properties and the classes."
      JmxEnabled:
        description: "If set to true, the connection pool creates a {@link org.apache.tomcat.jdbc.pool.jmx.ConnectionPoolMBean} object that can be registered with JMX to receive notifications and state about the pool. The ConnectionPool object doesn't register itself, as there is no way to keep a static non changing ObjectName across JVM restarts."
      LogAbandoned:
        description: "boolean flag to set if stack traces should be logged for application code which abandoned a Connection. Logging of abandoned Connections adds overhead for every Connection borrow because a stack trace has to be generated. The default value is false."
      LogValidationErrors:
        description: "Returns true if errors that happen during validation will be logged."
      MaxActive:
        description: "The maximum number of active connections that can be allocated from this pool at the same time. The default value is 100."
      MaxAge:
        description: "Time in milliseconds to keep this connection before reconnecting."
      MaxIdle:
        description: "The maximum number of connections that should be kept in the idle pool if {@link #isPoolSweeperEnabled()} returns false. If the If {@link #isPoolSweeperEnabled()} returns true, then the idle pool can grow up to {@link #getMaxActive} and will be shrunk according to {@link #getMinEvictableIdleTimeMillis()} setting. Default value is maxActive:100."
      MaxWait:
        description: "The maximum number of milliseconds that the pool will wait (when there are no available connections and the {@link #getMaxActive} has been reached) for a connection to be returned before throwing an exception. Default value is 30000 (30 seconds)."
      MinEvictableIdleTimeMillis:
        description: "The minimum amount of time an object must sit idle in the pool before it is eligible for eviction. The default value is 60000 (60 seconds)."
      MinIdle:
        description: "The minimum number of established connections that should be kept in the pool at all times."
      Name:
        description: "Returns the name of the connection pool. By default a JVM unique random name is assigned."
      NumActive:
        description: "Returns the numActive."
      NumIdle:
        description: "Returns the numIdle."
      NumTestsPerEvictionRun:
        description: "Property not used."
      Password:
        description: "Returns the password used when establishing connections to the database."
      PoolName:
        description: "Returns the poolName."
      PoolSweeperEnabled:
        description: "Returns true if the pool sweeper is enabled for the connection pool."
      PropagateInterruptState:
        description: "Returns true if the pool is configured to propagate interrupt state of a thread. A thread waiting for a connection, can have its wait interrupted, and by default will clear the interrupt flag and throw a {@link PoolExhaustedException}."
      ReconnectedCount:
        description: "Returns the reconnectedCount."
      ReleasedCount:
        description: "Returns the releasedCount."
      ReleasedIdleCount:
        description: "Returns the releasedIdleCount."
      RemoveAbandoned:
        description: "boolean flag to remove abandoned connections if they exceed the removeAbandonedTimeout."
      RemoveAbandonedCount:
        description: "Returns the removeAbandonedCount."
      RemoveAbandonedTimeout:
        description: "The time in seconds before a connection can be considered abandoned. The timer can be reset upon queries using an interceptor."
      ReturnedCount:
        description: "Returns the returnedCount."
      RollbackOnReturn:
        description: "Returns the rollbackOnReturn."
      Size:
        description: "Returns the size."
      SuspectTimeout:
        description: "Returns the time in seconds to pass before a connection is marked an abandoned suspect. Any value lesser than or equal to 0 means the check is disabled."
      TestOnBorrow:
        description: "The indication of whether objects will be validated before being borrowed from the pool."
      TestOnConnect:
        description: "Returns true if we should run the validation query when connecting to the database for the first time on a connection. Normally this is always set to false, unless one wants to use the validationQuery as an init query."
      TestOnReturn:
        description: "The indication of whether objects will be validated after being returned to the pool. If the object fails to validate, it will be dropped from the pool. NOTE - for a true value to have any effect, the validationQuery parameter must be set to a non-null string. Default value is false In order to have a more efficient validation, see {@link #setValidationInterval(long)}."
      TestWhileIdle:
        description: "Set to true if query validation should take place while the connection is idle."
      TimeBetweenEvictionRunsMillis:
        description: "The number of milliseconds to sleep between runs of the idle connection validation, abandoned cleaner and idle pool resizing. This value should not be set under 1 second. It dictates how often we check for idle, abandoned connections, and how often we validate idle connection and resize the idle pool. The default value is 5000 (5 seconds)."
      Url:
        description: "The URL used to connect to the database."
      UseDisposableConnectionFacade:
        description: "Returns true if this connection pool is configured to use a connection facade to prevent re-use of connection after {@link java.sql.Connection#close()} has been invoked."
      UseEquals:
        description: "Set to true if you wish the ProxyConnection class to use String.equals instead of == when comparing method names. This property does not apply to added interceptors as those are configured individually. The default value is false ."
      UseLock:
        description: "Return true if a lock should be used when operations are performed on the connection object. Should be set to false unless you plan to have a background thread of your own doing idle and abandon checking such as JMX clients. If the pool sweeper is enabled, then the lock will automatically be used regardless of this setting."
      UseStatementFacade:
        description: "Returns true if this connection pool is configured to wrap statements in order to enable equals() and hashCode() methods to be called on the closed statements if any statement proxy is set."
      Username:
        description: "Returns the username used to establish the connection with."
      ValidationInterval:
        description: "avoid excess validation, only run validation at most at this frequency - time in milliseconds. If a connection is due for validation, but has been validated previously within this interval, it will not be validated again. The default value is 3000 (3 seconds)."
      ValidationQuery:
        description: "The SQL query that will be used to validate connections from this pool before returning them to the caller or pool. If specified, this query does not have to return any data, it just can't throw an SQLException. The default value is null. Example values are SELECT 1(mysql), select 1 from dual(oracle), SELECT 1(MS Sql Server)."
      ValidationQueryTimeout:
        description: "The timeout in seconds before a connection validation queries fail. A value less than or equal to zero will disable this feature. Defaults to -1."
      Validator:
        description: "Returns the validator."
      ValidatorClassName:
        description: "Return the name of the optional validator class - may be null."
      WaitCount:
        description: "Returns the waitCount."
    operations:
      "checkAbandoned()":
        description: "Invokes checkAbandoned."
      "checkIdle()":
        description: "Invokes checkIdle."
      "purge()":
        description: "Purges all connections in the pool. For connections currently in use, these connections will be purged when returned on the pool. This call also purges connections that are idle and in the pool To only purge used/active connections see {@link #purgeOnReturn()}."
      "purgeOnReturn()":
        description: "Purges connections when they are returned from the pool. This call does not purge idle connections until they are used. To purge idle connections see {@link #purge()}."
      "resetStats()":
        description: "reset the statistics of this pool."
      "setAbandonWhenPercentageFull(int)":
        description: "A list of properties that are configurable for a connection pool."
        params:
          - name: percentage
            type: int
      "setAccessToUnderlyingConnectionAllowed(boolean)":
        description: "No-op."
        params:
          - name: accessToUnderlyingConnectionAllowed
            type: boolean
      "setAlternateUsernameAllowed(boolean)":
        description: "Set to true if the call {@link DataSource#getConnection(String, String) getConnection(username,password)} is allowed and honored.. This is used for when the pool is used by an application accessing multiple schemas. There is a performance impact turning this option on, even when not used due to username checks."
        params:
          - name: alternateUsernameAllowed
            type: boolean
      "setCommitOnReturn(boolean)":
        description: "Set to true if you want the connection pool to commit any pending transaction when a connection is returned. The default value is false, as this could result in committing data. This parameter is only looked at if the {@link #getDefaultAutoCommit()} returns false."
        params:
