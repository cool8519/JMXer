entries:
  - match:
      objectName: "Catalina:type=Server"
      className: "org.apache.catalina.core.StandardServer"
    description: "Apache Tomcat server MBean."
    attributes:
      Address:
        description: "Returns the address."
      Catalina:
        description: "Returns the catalina."
      CatalinaBase:
        description: "Returns the catalinaBase."
      CatalinaHome:
        description: "Returns the catalinaHome."
      DomainInternal:
        description: "Returns the domainInternal."
      GlobalNamingResources:
        description: "Returns the globalNamingResources."
      ObjectNameKeyProperties:
        description: "Returns the objectNameKeyProperties."
      ParentClassLoader:
        description: "Returns the parentClassLoader."
      PeriodicEventDelay:
        description: "Returns the periodicEventDelay."
      Port:
        description: "Returns the port."
      PortOffset:
        description: "Returns the portOffset."
      PortWithOffset:
        description: "Returns the portWithOffset."
      ServerBuilt:
        description: "Return the current server built timestamp."
      ServerInfo:
        description: "Report the current Tomcat Server Release number."
      ServerNumber:
        description: "Return the current server's version number."
      ServiceNames:
        description: "Returns the serviceNames."
      Shutdown:
        description: "Returns the shutdown."
      UseNaming:
        description: "Tests whether useNaming."
      UtilityExecutor:
        description: "Returns the utilityExecutor."
      UtilityThreads:
        description: "Returns the utilityThreads."
      UtilityThreadsAsDaemon:
        description: "Get if the utility threads are daemon threads."
    operations:
      "addPropertyChangeListener(java.lang.PropertyChangeListener)":
        description: "Add a property change listener to this component."
        params:
          - name: listener
            type: java.lang.PropertyChangeListener
      "addService(java.lang.Service)":
        description: "Invokes addService."
        params:
          - name: service
            type: java.lang.Service
      "await()":
        description: "Invokes await."
      "findServices()":
        description: "Invokes findServices."
        return: "Return type: Service[]."
      "getUtilityThreadsInternal(int)":
        description: "Handles the special values."
        return: "Return type: private static int."
        params:
          - name: utilityThreads
            type: int
      "removePropertyChangeListener(java.lang.PropertyChangeListener)":
        description: "Remove a property change listener from this component."
        params:
          - name: listener
            type: java.lang.PropertyChangeListener
      "removeService(java.lang.Service)":
        description: "Invokes removeService."
        params:
          - name: service
            type: java.lang.Service
      "setAddress(java.lang.String)":
        description: "Sets the address."
        params:
          - name: address
            type: java.lang.String
      "setCatalina(java.lang.Catalina)":
        description: "Sets the catalina."
        params:
          - name: catalina
            type: java.lang.Catalina
      "setCatalinaBase(java.lang.File)":
        description: "Sets the catalinaBase."
        params:
          - name: catalinaBase
            type: java.lang.File
      "setCatalinaHome(java.lang.File)":
        description: "Sets the catalinaHome."
        params:
          - name: catalinaHome
            type: java.lang.File
      "setGlobalNamingContext(javax.naming.Context)":
        description: "Global naming resources context."
        params:
          - name: globalNamingContext
            type: javax.naming.Context
      "setGlobalNamingResources(java.lang.NamingResourcesImpl)":
        description: "Sets the globalNamingResources."
        params:
          - name: globalNamingResources
            type: java.lang.NamingResourcesImpl
      "setParentClassLoader(java.lang.ClassLoader)":
        description: "Sets the parentClassLoader."
        params:
          - name: parent
            type: java.lang.ClassLoader
      "setPeriodicEventDelay(int)":
        description: "Set the new period between two lifecycle events in seconds."
        params:
          - name: periodicEventDelay
            type: int
      "setPort(int)":
        description: "Sets the port."
        params:
          - name: port
            type: int
      "setPortOffset(int)":
        description: "Sets the portOffset."
        params:
          - name: portOffset
            type: int
      "setShutdown(java.lang.String)":
        description: "Sets the shutdown."
        params:
          - name: shutdown
            type: java.lang.String
      "setState()":
        description: "Sets the state."
        return: "Return type: ."
      "setUtilityThreads(int)":
        description: "Sets the utilityThreads."
        params:
          - name: utilityThreads
            type: int
      "setUtilityThreadsAsDaemon(boolean)":
        description: "Set the utility threads daemon flag. The default value is true."
        params:
          - name: utilityThreadsAsDaemon
            type: boolean
      "storeConfig()":
        description: "Write the configuration information for this entire Server out to the server.xml configuration file."
      "storeContext(java.lang.Context)":
        description: "Write the configuration information for Context out to the specified configuration file."
        params:
          - name: context
            type: java.lang.Context

  - match:
      objectName: "Catalina:type=Service,*"
      className: "org.apache.catalina.core.StandardService"
    description: "Apache Tomcat service MBean."
    attributes:
      DomainInternal:
        description: "Returns the domainInternal."
      ObjectNameKeyProperties:
        description: "Returns the objectNameKeyProperties."
      ParentClassLoader:
        description: "Returns the parentClassLoader."
    operations:
      "addExecutor(java.lang.Executor)":
        description: "Invokes addExecutor."
        params:
          - name: ex
            type: java.lang.Executor
      "addPropertyChangeListener(java.lang.PropertyChangeListener)":
        description: "Standard implementation of the Service interface."
        params:
          - name: listener
            type: java.lang.PropertyChangeListener
      "findConnectors()":
        description: "Invokes findConnectors."
        return: "Return type: Connector[]."
      "findExecutors()":
        description: "Invokes findExecutors."
        return: "Return type: Executor[]."
      "getExecutor(java.lang.String)":
        description: "Invokes getExecutor."
        return: "Return type: Executor."
        params:
          - name: executorName
            type: java.lang.String
      "removeConnector(java.lang.Connector)":
        description: "Invokes removeConnector."
        params:
          - name: connector
            type: java.lang.Connector
      "removeExecutor(java.lang.Executor)":
        description: "Invokes removeExecutor."
        params:
          - name: ex
            type: java.lang.Executor
      "removePropertyChangeListener(java.lang.PropertyChangeListener)":
        description: "Remove a property change listener from this component."
        params:
          - name: listener
            type: java.lang.PropertyChangeListener
      "setParentClassLoader(java.lang.ClassLoader)":
        description: "Sets the parentClassLoader."
        params:
          - name: parent
            type: java.lang.ClassLoader
      "setState()":
        description: "Sets the state."
        return: "Return type: ."

  - match:
      objectName: "Catalina:type=Engine,*"
      className: "org.apache.catalina.core.StandardEngine"
    description: "Apache Tomcat engine container MBean."
    attributes:
      CatalinaBase:
        description: "Returns the catalinaBase."
      CatalinaHome:
        description: "Returns the catalinaHome."
      DomainInternal:
        description: "Returns the domainInternal."
      Name:
        description: "Returns the name."
      ObjectNameKeyProperties:
        description: "Returns the objectNameKeyProperties."
      ParentClassLoader:
        description: "Returns the parentClassLoader."
      Realm:
        description: "Returns the realm."
      RequestAttributesEnabled:
        description: "Returns the requestAttributesEnabled."
    operations:
      "addChild(java.lang.Container)":
        description: "Host name to use when no server host, or an unknown host, is specified in the request."
        params:
          - name: child
            type: java.lang.Container
      "containerEvent(java.lang.ContainerEvent)":
        description: "Invokes containerEvent."
        params:
          - name: event
            type: java.lang.ContainerEvent
      "lifecycleEvent(java.lang.LifecycleEvent)":
        description: "Invokes lifecycleEvent."
        params:
          - name: event
            type: java.lang.LifecycleEvent
      "logAccess(java.lang.Request,java.lang.Response,long,boolean)":
        description: "{@inheritDoc} Override the default implementation. If no access log is defined for the Engine, look for one in the Engine's default host and then the default host's ROOT context. If still none is found, return the default NoOp access log."
        params:
          - name: request
            type: java.lang.Request
          - name: response
            type: java.lang.Response
          - name: time
            type: long
          - name: useDefault
            type: boolean
      "propertyChange(java.lang.PropertyChangeEvent)":
        description: "Invokes propertyChange."
        params:
          - name: evt
            type: java.lang.PropertyChangeEvent
      "setParent(java.lang.Container)":
        description: "Disallow any attempt to set a parent for this Container, since an Engine is supposed to be at the top of the Container hierarchy."
        params:
          - name: container
            type: java.lang.Container
      "setRequestAttributesEnabled(boolean)":
        description: "Sets the requestAttributesEnabled."
        params:
          - name: requestAttributesEnabled
            type: boolean

  - match:
      objectName: "Catalina:type=Host,host=*"
      className: "org.apache.catalina.core.StandardHost"
    description: "Apache Tomcat virtual host container MBean."
    attributes:
      Aliases:
        description: "Returns the aliases."
      AutoDeploy:
        description: "{@inheritDoc} The default value for this implementation is true."
      ConfigClass:
        description: "Returns the configClass."
      ContextClass:
        description: "Returns the contextClass."
      CopyXML:
        description: "Tests whether copyXML."
      CreateDirs:
        description: "The set of aliases for this Host."
      DeployIgnore:
        description: "Returns the deployIgnore."
      DeployIgnorePattern:
        description: "Returns the deployIgnorePattern."
      DeployOnStartup:
        description: "{@inheritDoc} The default value for this implementation is true."
      DeployXML:
        description: "Tests whether deployXML."
      ErrorReportValveClass:
        description: "Returns the errorReportValveClass."
      FailCtxIfServletStartFails:
        description: "Tests whether failCtxIfServletStartFails."
      Name:
        description: "Returns the name."
      ObjectNameKeyProperties:
        description: "Returns the objectNameKeyProperties."
      UnpackWARs:
        description: "Tests whether unpackWARs."
      ValveNames:
        description: "Returns the valveNames."
      WorkDir:
        description: "Returns the workDir."
    operations:
      "addAlias(java.lang.String)":
        description: "Invokes addAlias."
        params:
          - name: alias
            type: java.lang.String
      "addChild(java.lang.Container)":
        description: "{@inheritDoc} The child must be an implementation of Context ."
        params:
          - name: child
            type: java.lang.Container
      "findAliases()":
        description: "Invokes findAliases."
        return: "Return type: String[]."
      "findReloadedContextMemoryLeaks()":
        description: "Used to ensure that regardless of {@link Context} implementation, a record is kept of the class loader used every time a context starts. private class MemoryLeakTrackingListener implements LifecycleListener {."
        return: "Return type: String[]."
      "removeAlias(java.lang.String)":
        description: "Invokes removeAlias."
        params:
          - name: alias
            type: java.lang.String
      "setAutoDeploy(boolean)":
        description: "Sets the autoDeploy."
        params:
          - name: autoDeploy
            type: boolean
      "setConfigClass(java.lang.String)":
        description: "Sets the configClass."
        params:
          - name: configClass
            type: java.lang.String
      "setContextClass(java.lang.String)":
        description: "Set the Java class name of the Context implementation class for new web applications."
        params:
          - name: contextClass
            type: java.lang.String
      "setCopyXML(boolean)":
        description: "Set the copy XML config file flag for this component."
        params:
          - name: copyXML
            type: boolean
      "setCreateDirs(boolean)":
        description: "Sets the createDirs."
        params:
          - name: createDirs
            type: boolean
      "setDeployIgnore(java.lang.String)":
        description: "Sets the deployIgnore."
        params:
          - name: deployIgnore
            type: java.lang.String
      "setDeployOnStartup(boolean)":
        description: "Sets the deployOnStartup."
        params:
          - name: deployOnStartup
            type: boolean
      "setDeployXML(boolean)":
        description: "Deploy XML Context config files flag mutator."
        params:
          - name: deployXML
            type: boolean
      "setErrorReportValveClass(java.lang.String)":
        description: "Set the Java class name of the error report valve class for new web applications."
        params:
          - name: errorReportValveClass
            type: java.lang.String
      "setFailCtxIfServletStartFails(boolean)":
        description: "Change the behavior of Servlet startup errors on web application starts."
        params:
          - name: failCtxIfServletStartFails
            type: boolean
      "setName(java.lang.String)":
        description: "Sets the name."
        params:
          - name: name
            type: java.lang.String
      "setUnpackWARs(boolean)":
        description: "Unpack WARs flag mutator."
        params:
          - name: unpackWARs
            type: boolean
      "setWorkDir(java.lang.String)":
        description: "Set host work directory base."
        params:
          - name: workDir
            type: java.lang.String

  - match:
