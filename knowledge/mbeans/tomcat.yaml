            type: java.lang.FilterMap
      "addListener(java.lang.Class)":
        description: "Invokes addListener."
        params:
          - name: listenerClass
            type: java.lang.Class
      "addListener(java.lang.String)":
        description: "Invokes addListener."
        params:
          - name: className
            type: java.lang.String
      "addLocaleEncodingMappingParameter(java.lang.String,java.lang.String)":
