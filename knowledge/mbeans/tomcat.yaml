          - name: locale
            type: java.lang.String
          - name: encoding
            type: java.lang.String
      "addMessageDestination(java.lang.MessageDestination)":
        description: "Add a message destination for this web application."
        params:
          - name: md
            type: java.lang.MessageDestination
      "addMimeMapping(java.lang.String,java.lang.String)":
        description: "Invokes addMimeMapping."
        params:
          - name: extension
