      ApplicationEventListeners:
        description: "Returns the applicationEventListeners."
      ApplicationLifecycleListeners:
        description: "Returns the applicationLifecycleListeners."
      AttributeNames:
        description: "Returns the attributeNames."
      Authenticator:
        description: "Returns the authenticator."
      BaseName:
        description: "Returns the baseName."
      CharsetMapper:
        description: "Returns the charsetMapper."
      CharsetMapperClass:
        description: "Returns the charsetMapperClass."
      ClassLoader:
        description: "Returns the classLoader."
      ClearReferencesHttpClientKeepAliveThread:
        description: "Returns the clearReferencesHttpClientKeepAliveThread."
      ClearReferencesRmiTargets:
