      "addFilterMap(java.lang.FilterMap)":
        description: "Invokes addFilterMap."
        params:
          - name: filterMap
            type: java.lang.FilterMap
      "addFilterMapBefore(java.lang.FilterMap)":
        description: "Invokes addFilterMapBefore."
        params:
