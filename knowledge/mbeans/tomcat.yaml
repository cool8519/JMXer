          - name: filter
            type: java.lang.NotificationFilter
          - name: object
            type: java.lang.Object
      "addParameter(java.lang.String,java.lang.String)":
        description: "Invokes addParameter."
        params:
          - name: name
            type: java.lang.String
          - name: value
            type: java.lang.String
      "addPostConstructMethod(java.lang.String,java.lang.String)":
        description: "Invokes addPostConstructMethod."
        params:
          - name: clazz
            type: java.lang.String
          - name: method
            type: java.lang.String
      "addPreDestroyMethod(java.lang.String,java.lang.String)":
        description: "Invokes addPreDestroyMethod."
        params:
          - name: clazz
            type: java.lang.String
          - name: method
