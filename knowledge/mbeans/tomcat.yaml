      XmlBlockExternal:
        description: "Returns the xmlBlockExternal."
      XmlNamespaceAware:
        description: "Returns the xmlNamespaceAware."
      XmlValidation:
        description: "Returns the xmlValidation."
    operations:
      "add(java.lang.FilterMap)":
        description: "Add a filter mapping at the end of the current set of filter mappings."
        params:
          - name: filterMap
            type: java.lang.FilterMap
      "addApplicationEventListener(java.lang.Object)":
        description: "Add a listener to the end of the list of initialized application event listeners."
        params:
          - name: listener
            type: java.lang.Object
      "addApplicationLifecycleListener(java.lang.Object)":
        description: "Add a listener to the end of the list of initialized application lifecycle listeners."
        params:
          - name: listener
            type: java.lang.Object
